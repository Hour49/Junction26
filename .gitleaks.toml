# gitleaks config for .github/workflows/security.yml: the default rules plus formats they miss.
# The same patterns are in .githooks/pre-commit; tools/test_gitleaks_config.py tests the rule below.
[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token (cfat_ prefix); the default rules have no pattern for it"
regex = '''cfat_[0-9A-Za-z_-]{20,}'''
keywords = ["cfat_"]
