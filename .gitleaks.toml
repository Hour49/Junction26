# gitleaks config for .github/workflows/security.yml: the default rules plus formats they miss.
# The same patterns are in .githooks/pre-commit; tools/test_gitleaks_config.py tests the rule and the allowlist.
[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token (cfat_ prefix); the default rules have no pattern for it"
regex = '''cfat_[0-9A-Za-z_-]{20,}'''
keywords = ["cfat_"]

# Unit tests that need a key use this one fake value (docs/ENGINEERING.md section 5). Only a secret that is
# exactly this string is skipped; any other key-shaped value is still a finding.
[[allowlists]]
description = "the fake key of the unit tests"
regexTarget = "secret"
regexes = ['''^test-key-0123456789$''']
