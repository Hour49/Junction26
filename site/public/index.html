<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hour49 at Junction 2026</title>
<meta name="description" content="Hour49 is at Junction 2026 in Espoo, 13-15 November. Our project is not decided yet: we pick a challenge tonight and build it over the weekend.">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3faf5;
    --ink: #04262a;
    --soft: #4d6168;
    --line: rgba(4, 38, 42, .28);
    --accent: #c4303f;
    --link: #0b7f88;
    --tile: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --ink: #d9f2e1;
      --soft: #8fa59a;
      --line: rgba(217, 242, 225, .35);
      --accent: #ff5d6c;
      --link: #33c6cf;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.6 "Space Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  main {
    position: relative;
    width: 100%; max-width: 640px;
    border: 1px solid var(--line);
    padding: 28px 24px;
  }
  main::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--line); opacity: .4; pointer-events: none; }
  .mark { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .mark img { width: 64px; height: 64px; background: var(--tile); padding: 6px; flex: none; }
  .mark span { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 14px; }
  .mark small { display: block; font-weight: 400; letter-spacing: .08em; color: var(--soft); font-size: 13px; text-transform: none; }
  h1 { margin: 0 0 20px; font-size: clamp(26px, 7vw, 38px); line-height: 1.15; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--accent); }
  p { margin: 0 0 16px; overflow-wrap: anywhere; }
  .when { color: var(--soft); font-size: 14px; }
  ul { list-style: none; margin: 28px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; }
  a { color: var(--link); text-underline-offset: 3px; }
  a:hover, a:focus-visible { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="mark">
    <img src="logo-49.png" alt="" width="64" height="64">
    <span>Hour49<small>Junction 2026, Espoo</small></span>
  </div>
  <h1>Our project is <em>yet to be decided.</em></h1>
  <p>We pick a challenge tonight and build it over the weekend. There is nothing to show here yet.</p>
  <p>Check back on Sunday 15 November.</p>
  <p class="when">Junction 2026 runs 13-15 November in Espoo.</p>
  <ul>
    <li><a href="https://hour49.com">hour49.com</a></li>
    <li><a href="https://github.com/Hour49/Junction26">github.com/Hour49/Junction26</a></li>
  </ul>
</main>
</body>
</html>
